<header class="topbar">


  <div class="page-info">

    <p>
      {{ workspaceTitle }}
    </p>


    <h1>
      {{ pageTitle }}
    </h1>

  </div>



  <div class="topbar-actions">


    <button
      class="icon-button"
      type="button"
      aria-label="Notifications"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>

        <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>

      </svg>


      <span class="notification-dot"></span>


    </button>




    <div class="topbar-user">


      <div class="avatar">

        {{ userName.charAt(0) }}

      </div>



      <div class="user-copy">

        <strong>
          {{ userName }}
        </strong>


        <span>
          {{ userRole }}
        </span>


      </div>


    </div>



  </div>


</header>
